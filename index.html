<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>计数器 · 思维面板</title>
  <style>
:root {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: #24324a;
  background: #eef2f8;
  font-synthesis: none;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.counter {
  width: min(100%, 440px);
  padding: 40px 28px 28px;
  border: 1px solid #dce3ef;
  border-radius: 28px;
  background: #fff;
  box-shadow: 0 20px 60px #24324a0d;
  text-align: center;
}
.eyebrow { color: #5366a3; font-size: 13px; letter-spacing: .12em; }
h1 { margin: 12px 0; font-size: 30px; }
.description, .hint { color: #606e84; line-height: 1.6; }
.description { font-size: 14px; }
#count {
  display: block;
  padding: 26px 0;
  font-size: clamp(44px, 12vw, 80px);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.actions { display: flex; gap: 12px; }
button {
  min-height: 52px;
  border: 1px solid #d9e0ec;
  border-radius: 12px;
  background: #f0f3f9;
  color: #24324a;
  font: inherit;
  font-size: 20px;
  cursor: pointer;
}
.actions button { flex: 1; min-width: 0; }
button:hover { background: #e1e7f3; }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 3px solid #bd6a13; outline-offset: 4px; }
.primary { background: #405bba; border-color: #405bba; color: white; }
.primary:hover { background: #324a9f; }
.reset { margin-top: 16px; padding: 0 24px; background: white; font-size: 15px; }
.hint { margin: 22px 0 0; font-size: 12px; }
.operation-summary { color: #606e84; font-size: 14px; }
#operations { color: #24324a; font-weight: 650; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
@media (max-width: 360px) {
  body { padding: 12px; }
  .counter { padding: 28px 18px; }
}
</style>
  <script type="module">
export function createCounter() {
  let value = 0;
  let operations = 0;
  return {
    get value() { return value; },
    get operations() { return operations; },
    increment() { operations++; return ++value; },
    decrement() { operations++; return --value; },
    reset() { operations++; value = 0; return value; },
  };
}

export function mountCounter(root) {
  const counter = createCounter();
  const output = root.querySelector('#count');
  const operationsOutput = root.querySelector('#operations');
  const render = () => {
    output.textContent = String(counter.value);
    operationsOutput.textContent = String(counter.operations);
  };
  for (const action of ['increment', 'decrement', 'reset']) {
    root.querySelector(`#${action}`).addEventListener('click', () => {
      counter[action]();
      render();
    });
  }
  render();
  return counter;
}

if (typeof document !== "undefined") mountCounter(document);
</script>
</head>
<body>
  <main class="counter" aria-labelledby="title">
    <p class="eyebrow">每一步，都算数</p>
    <h1 id="title">计数器</h1>
    <p class="description" id="project-description">连续开发验证项目</p>
    <p class="description">从零开始，记录你的每一次变化。</p>
    <p class="description" id="workflow-status">先记录，再推进</p>
    <output id="count" aria-live="polite" aria-atomic="true" aria-label="当前计数">0</output>
    <p class="operation-summary">累计操作次数：<output id="operations" aria-live="polite" aria-atomic="true" aria-label="累计操作次数">0</output></p>
    <div class="actions" role="group" aria-label="调整计数">
      <button id="decrement" type="button" aria-label="减一">−1</button>
      <button id="increment" class="primary" type="button" aria-label="加一">+1</button>
    </div>
    <button id="reset" class="reset" type="button">重置</button>
    <p class="hint">支持负数 · 重置后回到 0</p>
  </main>
</body>
</html>
